# docker compose up web          the browser page   http://localhost:8080
# docker compose run --rm cli check <model id>
services:
  web:
    build:
      context: .
      target: web
    image: "pedigree:web"
    ports:
      - "127.0.0.1:8080:8080"

  cli:
    build:
      context: .
      target: cli
    image: "pedigree:cli"
    profiles: ["cli"]
